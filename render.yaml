services:
  - type: web
    name: chusennote
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: CHUSENNOTE_DATABASE_URL
        sync: false
      - key: CHUSENNOTE_REQUIRE_POSTGRES
        value: "1"
      - key: CHUSENNOTE_SEARCH_PROVIDER
        value: tavily
      - key: CHUSENNOTE_SEARCH_API_KEY
        sync: false
      - key: CHUSENNOTE_FIREBASE_PROJECT_ID
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-service-account.json
      - key: CHUSENNOTE_TRUST_PROXY_HEADERS
        value: "1"
