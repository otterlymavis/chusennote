name: Android

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      # Caching only; the project's Gradle wrapper (android/gradlew) drives the
      # Gradle version so CI matches the verified local build exactly.
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Validate Android variants
        working-directory: android
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:assembleDebug
          :app:assembleDebugAndroidTest
          :app:lintDebug
          :app:assembleRelease
          :app:lintRelease
          --no-daemon
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: cd android && ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - name: Upload Android validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chusennote-android-validation-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            android/app/build/outputs/connected_android_test_additional_output/
            ${{ runner.temp }}/chusennote-emulator.log
          if-no-files-found: warn
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chusennote-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
