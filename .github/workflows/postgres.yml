name: Postgres

on:
  push:
    paths:
      - chusennote/**
      - lottery_monitor.py
      - tests/**
      - requirements.txt
      - .github/workflows/postgres.yml
  pull_request:
    paths:
      - chusennote/**
      - lottery_monitor.py
      - tests/**
      - requirements.txt
      - .github/workflows/postgres.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chusennote
          POSTGRES_PASSWORD: chusennote
          POSTGRES_DB: chusennote
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chusennote"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CHUSENNOTE_TEST_DATABASE_URL: postgresql://chusennote:chusennote@localhost:5432/chusennote
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test tooling and PostgreSQL driver
        run: python -m pip install -r requirements.txt pytest pytest-asyncio "psycopg[binary]>=3.2"
      - name: Run the full suite against PostgreSQL
        run: python -m pytest
